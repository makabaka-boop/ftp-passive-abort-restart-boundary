name: readonly-ftpd

services:
  ftpd:
    build: .
    image: readonly-ftpd:latest
    container_name: readonly-ftpd
    environment:
      FTPD_PORT: "2121"
      FTPD_ACCEPT_TIMEOUT_MS: "10000"
      PASV_PORT_MIN: "30000"
      PASV_PORT_MAX: "30009"
      # 测试钩子默认关闭;需要时取消注释(仅用于测试,勿在生产暴露):
      # FTPD_HOOK_PORT: "21220"
    ports:
      - "2121:2121"                 # 控制连接
      - "30000-30009:30000-30009"   # EPSV 数据连接端口段
      # - "21220:21220"
    restart: unless-stopped
